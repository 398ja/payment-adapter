spring.application.name=payment-gateway-rest
server.port=${SERVER_PORT:8080}

#spring.datasource.url=jdbc:postgresql://dbserver/gateway
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gateway}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gateway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gateway}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.address=${SERVER_ADDRESS:0.0.0.0}

# Actuator (health/info/prometheus exposure for ops)
#
# The Prometheus registry has always been on the classpath, but `prometheus`
# was missing from the exposure list, so /actuator/prometheus returned 404 and
# every metric this service records was unreachable. Metrics that nothing can
# scrape read identically to a service that is not doing anything.
#
# The management port DEFAULTS TO THE API PORT so existing container
# healthchecks and probes that call <api-port>/actuator/health keep working.
#
# Operators SHOULD split it in any environment reachable from outside, by
# setting PAYMENT_ADAPTER_MANAGEMENT_PORT to a port that is not published:
# /actuator/prometheus exposes payment volumes and gateway failure counts, and
# on the shared public port it sits behind whatever protects the API. This is
# the arrangement the mint enforces (cashu-mint issue #346). If you split it,
# repoint the healthcheck at the new port in the same change, or the container
# never reports ready.
#
# `management.server.address` is deliberately NOT set here. Spring Boot rejects
# it outright ("Management-specific server address cannot be configured as the
# management server is not listening on a separate port") whenever the
# management port equals the server port, which is the default below — so
# setting it unconditionally crash-loops the service. Operators who split the
# port and need a specific bind address set both together:
#
#   PAYMENT_ADAPTER_MANAGEMENT_PORT=9000
#   MANAGEMENT_SERVER_ADDRESS=0.0.0.0
management.server.port=${PAYMENT_ADAPTER_MANAGEMENT_PORT:${SERVER_PORT:8080}}
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.prometheus.metrics.export.enabled=true

# Metric tags (common labels). `application` and `env` match the labels the
# mint applies, so one Grafana dashboard can filter across both services.
management.metrics.tags.application=payment-adapter
management.metrics.tags.env=${ENVIRONMENT:local}
